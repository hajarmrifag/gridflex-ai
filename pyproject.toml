[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gridflex-ai"
version = "0.1.0"
description = "Battery dispatch and demand-flexibility simulator for renewable power systems"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "streamlit>=1.39,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
